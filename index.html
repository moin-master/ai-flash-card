<!doctype html>
<html lang="en" class="hubhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AI Flash Cards</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="hub.css?v=5">
</head>
<body class="hub">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="wrap">
    <h1 class="hero">Learn AI terms.<br><span class="grad">Ace the interview.</span></h1>
    <p class="sub">Swipe. Remember. Repeat.</p>

    <section class="overall" aria-label="Your progress">
      <div class="overall-top">
        <div id="ring" class="o-ring" style="--p:0%"><div><b id="oPct">0%</b></div></div>
        <div class="o-nums">
          <div><b id="sKnown">0</b><span>GOT IT</span></div>
          <div><b id="sReview">0</b><span>REVIEW</span></div>
          <div><b id="sStar">0</b><span>STARRED</span></div>
        </div>
      </div>
      <p id="oLine" class="o-line"></p>
      <a id="cta" class="cta" href="#">
        <span id="ctaText">Start learning</span>
        <span class="cta-arrow">→</span>
      </a>
    </section>

    <h2 class="section">Tracks</h2>
    <div id="decks" class="tracks"></div>

    <h2 class="section">How it works</h2>
    <div class="how">
      <div><i>⬆️</i><b>Swipe up</b><span>next card</span></div>
      <div><i>✅</i><b>Swipe right</b><span>got it</span></div>
      <div><i>🔁</i><b>Swipe left</b><span>review later</span></div>
      <div><i>⭐</i><b>Double tap</b><span>star / unstar</span></div>
    </div>

    <button id="clear" class="clear" type="button">🗑 Clear all Got it &amp; Review</button>
    <p class="note">Progress is saved on this device only.</p>
  </main>

  <footer class="foot">© Moin Master</footer>

  <script src="data/decks.js"></script>
  <script src="hub.js?v=5"></script>
</body>
</html>
