<!doctype html>
<html lang="en" class="hubhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Agentic AI</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <link rel="stylesheet" href="../style/style.css?v=27">
  <link rel="stylesheet" href="../style/hub.css?v=27">
</head>
<body class="hub has-navbar" data-deck="agentic" data-theme="blue">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <header class="navbar">
    <a class="nav-back" href="../index.html" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="nav-title">Agentic AI</span>
    <span></span>
  </header>

  <main class="app-main">
    <header class="large">
      <h1 class="hero">🕹️ Agentic AI <span class="grad">Dashboard</span></h1>
      <p class="sub">Agents, tools, memory, MCP</p>
    </header>

    <div class="summary">
      <div class="sum-top">
        <div id="ring" class="ring" style="--p:0%"><div><b id="bigPct">0%</b><span id="bigSub">0 / 0</span></div></div>
        <div class="nums">
          <div class="k"><b id="sKnown">0</b><span>Got it</span></div>
          <div class="r"><b id="sReview">0</b><span>Review</span></div>
          <div class="s"><b id="sStar">0</b><span>Starred</span></div>
        </div>
      </div>
      <p id="sumLine" class="sum-line"></p>
      <a id="cta" class="primary" href="agentic-flash-card.html"><span class="p-left"><svg class="p-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5h10.5A2.5 2.5 0 0 1 21 6v11"/><rect x="3" y="6" width="13" height="15" rx="2.5" fill="currentColor" fill-opacity=".18"/><path d="M7 11h5M7 15h3"/></svg><span id="ctaText">Start flash cards</span></span><span>›</span></a>
    </div>

    <h2 class="gh">Study</h2>
    <div class="study-grid">
      <a id="studyReview" class="stile" href="agentic-flash-card.html?mode=review" style="--c:#ff5c8a">
        <span class="s-emoji">🔁</span>
        <b id="reviewNum">0</b>
        <span class="s-label">Review</span>
        <em id="reviewHint">Swipe a card left</em>
      </a>
      <a id="studyStar" class="stile" href="agentic-flash-card.html?mode=starred" style="--c:#ffd23f">
        <span class="s-emoji">⭐</span>
        <b id="starNum">0</b>
        <span class="s-label">Starred</span>
        <em id="starHint">Double-tap a card</em>
      </a>
      <a id="studyNew" class="stile wide" href="agentic-flash-card.html" style="--c:#4da3ff">
        <span class="s-emoji">✨</span>
        <span class="s-mid"><b id="newNum">0</b><span class="s-label">New cards to learn</span></span>
        <span class="s-go">→</span>
      </a>
    </div>

    <h2 class="gh">Topics</h2>
    <div id="topics" class="group"></div>

    <h2 class="gh">Needs review</h2>
    <div id="reviewList" class="group"></div>

    <h2 class="gh">Starred</h2>
    <div id="starList" class="group"></div>

    <button id="clear" class="clear" type="button">🗑 Clear Agentic Got it &amp; Review</button>
    <p class="note">Progress is saved on this device only.</p>
    <footer class="foot">© Moin Master</footer>
  </main>

  <script src="../data/decks.js?v=27"></script>
  <script src="../data/agentic.js?v=27"></script>
  <script src="../js/dashboard.js?v=27"></script>
</body>
</html>
