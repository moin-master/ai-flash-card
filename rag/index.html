<!doctype html>
<html lang="en" class="hubhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>RAG Dashboard</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon.svg">
  <link rel="stylesheet" href="../style.css?v=4">
  <link rel="stylesheet" href="../hub.css?v=5">
</head>
<body class="hub" data-deck="rag">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="wrap">
    <a class="crumb" href="../">← All decks</a>
    <h1 class="dash-title">🔎 RAG <span class="grad">Dashboard</span></h1>

    <section class="big-ring-box">
      <div id="bigRing" class="big-ring" style="--p:0%"><div><b id="bigPct">0%</b><span id="bigSub">0 / 0 mastered</span></div></div>
    </section>

    <a id="cta" class="cta" href="rag-flash-card.html">
      <span id="ctaText">Start flash cards</span>
      <span class="cta-arrow">→</span>
    </a>

    <section class="stats four" aria-label="RAG progress">
      <div class="stat-pill k"><b id="sKnown">0</b><span>GOT IT</span></div>
      <div class="stat-pill r"><b id="sReview">0</b><span>REVIEW</span></div>
      <div class="stat-pill s"><b id="sStar">0</b><span>STARRED</span></div>
      <div class="stat-pill d"><b id="sNew">0</b><span>NEW</span></div>
    </section>

    <div class="study">
      <a id="studyReview" class="study-btn r" href="rag-flash-card.html?mode=review">✖ Study review</a>
      <a id="studyStar" class="study-btn s" href="rag-flash-card.html?mode=starred">⭐ Study starred</a>
    </div>

    <h2 class="section">By topic</h2>
    <div id="topics" class="topics"></div>

    <h2 class="section">Needs review</h2>
    <div id="reviewList" class="cardlist"></div>

    <h2 class="section">Starred</h2>
    <div id="starList" class="cardlist"></div>

    <button id="clear" class="clear" type="button">🗑 Clear RAG Got it &amp; Review</button>
    <p class="note">Progress is saved on this device only.</p>
  </main>

  <footer class="foot">© Moin Master</footer>

  <script src="../data/decks.js"></script>
  <script src="../data/rag.js"></script>
  <script src="dashboard.js?v=4"></script>
</body>
</html>
